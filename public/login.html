<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · StreamVoice</title><link rel="icon" href="/assets/branding/favicon-32.png"><link rel="stylesheet" href="/style.css"></head><body class="login-page"><main class="login-card"><img src="/assets/branding/logo.png" width="72" height="72" alt="StreamVoice"><p class="eyebrow">TU ESTUDIO PERSONAL</p><h1>Tu comunidad tiene voz.</h1><p>Ingresa a tu cuenta para abrir el estudio.</p><form id="setup-form" hidden><p>Configura la contraseña de el administrador para administrar las cuentas.</p><label for="setup-password">Contraseña de administrador</label><input id="setup-password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required><div id="setup-token-field" hidden><label for="setup-token">Clave de inicialización de Cloudflare</label><input id="setup-token" type="password" autocomplete="off" minlength="32"><p class="login-note">Úsala una sola vez y mantenla privada.</p></div><p id="setup-error" role="alert"></p><button class="button primary full" type="submit">Crear cuenta de administrador</button></form><form id="login-form"><div id="server-field" hidden><label for="server-url">Dirección de administración</label><input id="server-url" type="url" placeholder="https://…" autocomplete="url"><p class="login-note">Solicita esta dirección a el administrador.</p></div><label for="login-user">Usuario</label><input id="login-user" name="username" autocomplete="username" required maxlength="50"><label for="login-password">Contraseña</label><input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="256"><p id="login-error" role="alert"></p><button class="button primary full" type="submit">Entrar al estudio →</button></form><p class="login-note">Tus canales, voces y personajes en un solo lugar.</p></main><script type="module" src="/login.js"></script></body></html>
